<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>小さい表示の評価ボックス</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  /* 小さい表示の評価ボックスが互いに重ならないように、アイコンの間を広く空ける */
  nav ul { display: flex; gap: 160px; list-style: none; padding: 0; margin: 0 0 24px; align-items: flex-start; }
  .clip { width: 240px; height: 120px; overflow: hidden; border: 1px solid #333; margin-bottom: 24px; }
  .clip img { display: block; }
  .cards { display: flex; gap: 48px; margin-bottom: 24px; }
  /* 画像が枠より大きく、枠で切り取られるカード（枠線なし） */
  .card { width: 200px; height: 120px; overflow: hidden; position: relative; background: #eee; }
  #card-img { display: block; margin-left: -60px; margin-top: -50px; }
  #card2-img { display: block; margin-left: 30px; margin-top: -40px; }
</style>
</head>
<body>
<main>
  <h1>小さい表示の評価ボックス</h1>
  <nav aria-label="アイコンのメニュー">
    <ul>
      <li><a id="icon-link" href="https://example.com/home"><img id="small" src="/img/small.png" alt="ホーム" width="24" height="24"></a></li>
      <li><img id="small-empty" src="/img/small-empty.png" alt="" width="24" height="24"></li>
      <li><img id="small-noalt" src="/img/small-noalt.png" width="24" height="24"></li>
      <li><img id="narrow" src="/img/narrow.png" alt="細い画像" width="40" height="200"></li>
    </ul>
  </nav>
  <div class="clip" id="clip">
    <img id="clipped" src="/img/clipped.png" alt="枠いっぱいの画像" width="240" height="120">
  </div>
  <div class="cards">
    <div class="card" id="card">
      <img id="card-img" src="/img/card-img.png" alt="カードの写真" width="320" height="240">
    </div>
    <div class="card" id="card2">
      <img id="card2-img" src="/img/card2-img.png" alt="ずれたカードの写真" width="320" height="240">
    </div>
  </div>
  <p><a id="big-link" href="https://example.com/big"><img id="big" src="/img/big.png" alt="大きい画像" width="200" height="150"></a></p>
  <p><a id="after" href="https://example.com/after">最後のリンク</a></p>
</main>
</body>
</html>
