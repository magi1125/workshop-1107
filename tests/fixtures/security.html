<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>&lt;img src=x onerror="window.__pwned=1"&gt;"&gt;&lt;script&gt;window.__pwned=1&lt;/script&gt;</title>
</head>
<body>
<main>
  <h1>文字列の扱い</h1>
  <p><img id="xss-alt" src="/img/xss-alt.png" alt='<img src=x onerror="window.__pwned=1">' width="100" height="80"></p>
  <p><img id="xss-label" src="/img/xss-label.png" aria-label='"><script>window.__pwned=1</script>' width="100" height="80"></p>
  <p><img id="xss-title" src="/img/xss-title.png" title='<svg onload="window.__pwned=1"></svg>' width="100" height="80"></p>
  <div aria-hidden="true"><img id="xss-hidden" src="/img/xss-hidden.png" alt='<iframe srcdoc="<script>parent.__pwned=1</script>"></iframe>' width="100" height="80"></div>
  <span id="xss-ref">&lt;img src=x onerror="window.__pwned=1"&gt;</span>
  <p><img id="xss-ref-img" src="/img/xss-ref-img.png" aria-labelledby="xss-ref" width="100" height="80"></p>

  <form id="form" action="/submitted" method="get">
    <p><img id="in-form" src="/img/in-form.png" alt="フォームの中の画像" width="100" height="80"></p>
    <p><label>検索語 <input name="q" value="テスト"></label></p>
  </form>

  <div id="clickable"><p><img id="in-clickable" src="/img/in-clickable.png" alt="クリックを拾う要素の中の画像" width="100" height="80"></p></div>
</main>
<script>
  window.__submitted = 0;
  window.__docClicks = 0;
  window.__divClicks = 0;
  window.__docKeydowns = 0;
  document.getElementById('form').addEventListener('submit', () => { window.__submitted++; });
  document.addEventListener('click', () => { window.__docClicks++; });
  document.getElementById('clickable').addEventListener('click', () => { window.__divClicks++; });
</script>
</body>
</html>
