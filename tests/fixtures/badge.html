<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>小さい画像の印</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  /* 位置のテストのため、画像はすべて絶対位置で置く（画面 1280×900 に収まる） */
  .abs { position: absolute; }
  img { display: block; }
  /* 24px のアイコンを 4px の間隔で並べたメニュー */
  #row-a { position: absolute; left: 200px; top: 220px; display: flex; gap: 4px; margin: 0; padding: 0; list-style: none; }
  #row-a a { display: block; }
  /* 印の位置の候補が順に埋まるように、アイコンを詰めて置いた集まり */
  #cluster { position: absolute; left: 600px; top: 140px; width: 300px; height: 70px; }
  #cluster img { position: absolute; }
  /* 画面の右端の近くのアイコン */
  #edge-img { position: absolute; right: 30px; top: 320px; }
  /* 画像が枠より大きく、枠で切り取られるカード */
  #card { position: absolute; left: 200px; top: 420px; width: 200px; height: 120px; overflow: hidden; background: #eee; }
  #card-img { margin-left: -60px; margin-top: -50px; }
  /* 透明なリンクがカード全体を覆う（stretched link）カード。切り取りは無い */
  #ocard { position: absolute; left: 480px; top: 420px; width: 220px; padding: 10px; background: #f4f4f4; }
  /* 画像の枠が重なりの文脈（z-index: 0）を作るため、枠の中の要素は、外のリンクの重なり（z-index: 1）より上に出られない */
  #ocard .media { position: relative; z-index: 0; }
  #ocard h2 { font-size: 16px; margin: 8px 0 0; }
  #ocard .stretched::after { content: ""; position: absolute; inset: 0; z-index: 1; background: transparent; }
  #normal { position: absolute; left: 800px; top: 420px; }
  #after { position: absolute; left: 200px; top: 720px; }
</style>
</head>
<body>
<main>
  <h1 id="top">小さい画像の印</h1>

  <img id="iso-img" class="abs" style="left: 200px; top: 120px;" src="/img/iso-img.png" alt="設定" width="24" height="24">
  <svg id="iso-svg" class="abs" style="left: 400px; top: 120px;" width="20" height="20"><title>通知</title><rect width="20" height="20" fill="#468"/></svg>

  <ul id="row-a" aria-label="アイコンのメニュー">
    <li><a id="row-a-link-0" href="https://example.com/m0"><img id="row-a-0" src="/img/row-a-0.png" alt="メニュー0" width="24" height="24"></a></li>
    <li><a id="row-a-link-1" href="https://example.com/m1"><img id="row-a-1" src="/img/row-a-1.png" alt="メニュー1" width="24" height="24"></a></li>
    <li><a id="row-a-link-2" href="https://example.com/m2"><img id="row-a-2" src="/img/row-a-2.png" alt="メニュー2" width="24" height="24"></a></li>
    <li><a id="row-a-link-3" href="https://example.com/m3"><img id="row-a-3" src="/img/row-a-3.png" alt="メニュー3" width="24" height="24"></a></li>
    <li><a id="row-a-link-4" href="https://example.com/m4"><img id="row-a-4" src="/img/row-a-4.png" alt="メニュー4" width="24" height="24"></a></li>
  </ul>

  <div id="cluster">
    <img id="cl-a1" src="/img/cl-a1.png" alt="A1" width="16" height="16" style="left: 54px; top: -16px;">
    <img id="cl-a2" src="/img/cl-a2.png" alt="A2" width="16" height="16" style="left: 54px; top: 44px;">
    <img id="cl-b" src="/img/cl-b.png" alt="B" width="24" height="40" style="left: 40px; top: 0;">
    <img id="cl-c1" src="/img/cl-c1.png" alt="C1" width="16" height="16" style="left: 154px; top: -16px;">
    <img id="cl-c2" src="/img/cl-c2.png" alt="C2" width="16" height="16" style="left: 154px; top: 44px;">
    <img id="cl-c3" src="/img/cl-c3.png" alt="C3" width="16" height="16" style="left: 124px; top: 44px;">
    <img id="cl-c" src="/img/cl-c.png" alt="C" width="24" height="40" style="left: 140px; top: 0;">
    <img id="cl-d1" src="/img/cl-d1.png" alt="D1" width="16" height="16" style="left: 254px; top: -16px;">
    <img id="cl-d" src="/img/cl-d.png" alt="D" width="24" height="40" style="left: 240px; top: 0;">
  </div>

  <img id="edge-img" src="/img/edge-img.png" alt="右端のアイコン" width="24" height="24">

  <div id="card">
    <img id="card-img" src="/img/card-img.png" alt="カードの写真" width="320" height="240">
  </div>

  <div id="ocard">
    <div class="media"><img id="obscured" src="/img/obscured.png" alt="覆われたカードの写真" width="200" height="120"></div>
    <h2><a class="stretched" id="ocard-link" href="https://example.com/article">カードの見出し</a></h2>
  </div>

  <img id="normal" src="/img/normal.png" alt="通常の写真" width="120" height="90">

  <p id="after"><a id="after-link" href="https://example.com/after">最後のリンク</a></p>
</main>
</body>
</html>
